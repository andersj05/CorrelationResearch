[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "btc-nasdaq-research"
version = "0.1.0"
description = "Notebook-first Bitcoin / Nasdaq beta and mean-reversion research"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "statsmodels>=0.14.4,<0.15", "matplotlib>=3.9,<4", "seaborn>=0.13,<0.14",
  "plotly>=6,<7", "ipywidgets>=8,<9", "ipykernel>=6.29,<8",
  "jupyterlab>=4.3,<5", "nbformat>=5.10,<6", "nbclient>=0.10,<0.11",
  "nbconvert>=7.16,<8", "pyarrow>=18", "requests>=2.32,<3",
  "yfinance>=0.2.54,<1", "pandas-market-calendars>=5,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/btc_nasdaq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
cache-dir = ".uv-cache"
